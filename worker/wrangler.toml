name            = "mohasib-email-inbound"
main            = "src/index.js"
compatibility_date = "2026-05-15"
preview_urls = false

[observability.logs]
enabled = true

# Email handler — required for Cloudflare Email Routing workers
[vars]
# Override these in the Cloudflare dashboard (Workers → mohasib-email → Settings → Variables)
# or set them as secrets with: wrangler secret put WORKER_SECRET
APP_URL       = "https://mohasibai.com"
